# ── 禁用：云平台（检测全局凭证，到处出没）──────────────────
[aws]
disabled = true

[azure]
disabled = true

[gcloud]
disabled = true

[openstack]
disabled = true

# ── 禁用：容器 / 基础设施（全局 context，非项目级）─────────
[kubernetes]
disabled = true

[docker_context]
disabled = true

[terraform]
disabled = true

[vagrant]
disabled = true

[pulumi]
disabled = true

[container]
disabled = true

# ── 禁用：包版本（通常噪音大于信号）────────────────────────
[package]
disabled = true

# ── 禁用：系统级信息（终端里通常不需要）────────────────────
[battery]
disabled = true

[memory_usage]
disabled = true

[status]
disabled = true

[sudo]
disabled = true

[shlvl]
