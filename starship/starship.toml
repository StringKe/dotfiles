# [TEMPLATE] starship/starship.toml
# 部署目标: ~/.config/starship.toml
# AI 部署时复制此文件，不修改本文件。

"$schema" = 'https://starship.rs/config-schema.json'

add_newline        = false
command_timeout    = 10000
continuation_prompt = "[.](bright-black) "

# 不指定 palette / 不重定义颜色：starship symbols 用 ANSI 颜色名 (red/green/blue 等)，
# 由终端 (ghostty 的 GitHub Light Colorblind 主题) 渲染为色盲友好配色。

# ── 提示符 ──────────────────────────────────────────────────
[character]
success_symbol          = "[>](bold green)"
error_symbol            = "[x](bold red)"
vimcmd_symbol           = "[<](bold green)"
vimcmd_visual_symbol    = "[<](bold yellow)"
vimcmd_replace_symbol   = "[<](bold purple)"
vimcmd_replace_one_symbol = "[<](bold purple)"

# ── 目录 ────────────────────────────────────────────────────
[directory]
truncate_to_repo = true
truncation_length = 3
read_only = " ro"

# ── Git ─────────────────────────────────────────────────────
[git_branch]
symbol           = "git "
truncation_symbol = "..."

[git_commit]
tag_symbol = " tag "

[git_status]
ahead   = ">"
behind  = "<"
diverged = "<>"
renamed = "r"
deleted = "x"

# ── 耗时（超过 2s 才显示）────────────────────────────────────
[cmd_duration]
min_time = 2000

# ── 语言版本：按项目文件条件激活，无需改动 ──────────────────
# Starship 只在检测到对应文件时才展示（go.mod / package.json / Cargo.toml 等）

[bun]
symbol = "bun "

[c]
symbol = "C "

[cpp]
symbol = "C++ "

[crystal]
symbol = "cr "

[cmake]
symbol = "cmake "

[dart]
symbol = "dart "

[deno]
symbol = "deno "

[dotnet]
symbol = "dotnet "
format = "via [$symbol($version )(target $tfm )]($style)"

