# [TEMPLATE] herdr/config.toml - agent multiplexer（https://herdr.dev）
# 部署目标: ~/.config/herdr/config.toml
# AI 部署时复制此文件，不修改本文件。
#
# herdr 0.7+ · 配置文档 https://herdr.dev/docs/configuration/
# 改配置后生效: herdr server reload-config
#
# ══════════════════════════════════════════════════════════════════════════════
# 键位分层（与 ghostty 零冲突的设计，四层从外到内）
# ══════════════════════════════════════════════════════════════════════════════
#
#   cmd 层             ghostty 独占（tab / split / 字体 / 搜索），herdr 永远看不到
#   ctrl+alt 直达层    herdr 高频操作（本文件 [keys] 追加；ghostty 默认零占用，
#                      依赖 ghostty 的 macos-option-as-alt = left）
#   ctrl+b prefix 层   herdr 全量操作，保持官方默认（prefix+? 看全表）
#   其余按键           直达 pane 内程序（Claude Code 的 shift+tab / esc / ctrl+r 等）
#
# - 给内层程序发送字面 ctrl+b（如 Claude Code 命令转后台）: 按 ctrl+b ctrl+b
# - herdr 接管鼠标时，按住 shift 回到 ghostty 原生选择 / cmd+click 开链接
#
# 使用约定: herdr 会话内一律用 herdr 的 tab / pane（持久化 + agent 状态跟踪都在
# herdr 层，ghostty 分屏里的进程关窗即死）；ghostty 的 cmd+t / cmd+d 留给
# herdr 之外的临时 shell。

onboarding = false

# ══════════════════════════════════════════════════════════════════════════════
# Theme
# ══════════════════════════════════════════════════════════════════════════════

# terminal: 跟随终端 ANSI 配色（即 ghostty 的 GitHub Light Colorblind），
# 与 bat "ansi" / atuin fallback / starship 同一策略，ghostty 换主题自动跟随。
[theme]
name = "terminal"
auto_switch = false

# 需要微调单个 token 时启用（支持 hex / rgb() / 命名色 / "reset"）
# [theme.custom]
# accent = "#0969da"

# ══════════════════════════════════════════════════════════════════════════════
# Keys（prefix 保持默认 ctrl+b，只给高频操作追加 ctrl+alt 直达别名）
# ══════════════════════════════════════════════════════════════════════════════

[keys]
focus_pane_left  = ["prefix+h", "ctrl+alt+h"]
focus_pane_down  = ["prefix+j", "ctrl+alt+j"]
focus_pane_up    = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
zoom             = ["prefix+z", "ctrl+alt+z"]
new_tab          = ["prefix+c", "ctrl+alt+c"]
next_tab         = ["prefix+n", "ctrl+alt+n"]
previous_tab     = ["prefix+p", "ctrl+alt+p"]
goto             = ["prefix+g", "ctrl+alt+g"]
toggle_sidebar   = ["prefix+b", "ctrl+alt+b"]

# ══════════════════════════════════════════════════════════════════════════════
# 通知（agent 完成 / blocked 时走 ghostty 原生通知协议）
# ══════════════════════════════════════════════════════════════════════════════

[ui.toast]
delivery = "terminal"

# ══════════════════════════════════════════════════════════════════════════════
# Scrollback（pane 是 alternate screen，ghostty 的 scrollback 对 pane 内部无效）
# ══════════════════════════════════════════════════════════════════════════════

[advanced]
scrollback_limit_bytes = 104857600   # 100MB

# ══════════════════════════════════════════════════════════════════════════════
# CJK / 中文输入法
# ══════════════════════════════════════════════════════════════════════════════

[experimental]
# 按 prefix 自动切 ASCII 输入源，h/j/k/l 不会进中文候选
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
