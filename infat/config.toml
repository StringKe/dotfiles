# [TEMPLATE] infat/config.toml - macOS 文件关联
# 部署目标: ~/.config/infat/config.toml
# AI 部署时复制此文件，不修改本文件。
# 应用配置: infat --config ~/.config/infat/config.toml
#
# 注意：macOS 26 (Tahoe) 的 LaunchServices 仅允许为系统已注册 UTI 的扩展名设置
# 默认应用，其他扩展名会报 error -50。此配置仅保留实际有效的项。
#
# 不设 html / svg——与浏览器争 public.html / public.svg-image，可能连带影响 http/https。
# [schemes] 只绑 vscode://，不写 http / https（VS Code 未注册这两个 scheme）。
#
# 不设 sh / bash——同样触发 error -50（Tahoe 不让 infat 改这两个已被 Ghostty/Xcode
# 抢注的扩展名）。改用 duti 按扩展名语法设置，见 CLAUDE.md「部署流程」。

[extensions]
json = "Visual Studio Code"
yaml = "Visual Studio Code"
xml  = "Visual Studio Code"
csv  = "Visual Studio Code"
ts   = "Visual Studio Code"
md   = "Visual Studio Code"

[types]
sourcecode = "Visual Studio Code"
json       = "Visual Studio Code"
yaml       = "Visual Studio Code"

[schemes]
vscode          = "Visual Studio Code"
vscode-insiders = "Visual Studio Code"