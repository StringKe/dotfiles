# [TEMPLATE] btop/btop.conf
# 部署目标: ~/.config/btop/btop.conf
# AI 部署时复制此文件，不修改本文件。
#
# 主题文件必须存在于:
#   ~/.config/btop/themes/catppuccin_latte.theme
#   /opt/homebrew/Cellar/btop/<ver>/share/btop/themes/catppuccin_latte.theme
# 由 bin/install-themes.sh 下载

color_theme = "catppuccin_latte"
theme_background = True
truecolor = True
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"
proc_sorting = "cpu lazy"
proc_mem_bytes = True
cpu_invert_lower = True
