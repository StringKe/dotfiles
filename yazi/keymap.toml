# [TEMPLATE] yazi/keymap.toml - Yazi 键位
# 部署目标: ~/.config/yazi/keymap.toml
# AI 部署时复制此文件（仅当目标不存在），不修改本文件。

[mgr]
prepend_keymap = [
    # Enter 只用于进入目录，不打开文件
    { on = ["<Enter>"], run = "enter", desc = "Enter directory" },

    # o 键用于打开文件/文件夹（原 Enter 的行为）
    { on = ["o"], run = "open", desc = "Open file or directory" },
]
