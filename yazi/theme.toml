# [TEMPLATE] yazi/theme.toml
# 部署目标: ~/.config/yazi/theme.toml
# AI 部署时复制此文件（仅当目标不存在），不修改本文件。
#
# 用 ANSI 颜色名而非 hex：颜色由终端主题渲染（ghostty 的 GitHub Light Colorblind
# 已把 ANSI red 映射为橙色，green 为蓝色，自动色盲友好）。
# 不写死 hex 避免和终端主题双重映射。

[mgr]
cwd = { fg = "blue" }

hovered         = { reversed = true }
preview_hovered = { underline = true }

find_keyword  = { fg = "yellow", bold = true, italic = true, underline = true }
find_position = { fg = "magenta", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "green",   bg = "green" }
marker_cut      = { fg = "red",     bg = "red" }
marker_marked   = { fg = "cyan",    bg = "cyan" }
marker_selected = { fg = "magenta", bg = "magenta" }

tab_active   = { reversed = true }
tab_inactive = {}
tab_width    = 1

count_copied   = { fg = "white", bg = "green" }
count_cut      = { fg = "white", bg = "red" }
count_selected = { fg = "white", bg = "magenta" }

border_symbol = "│"
border_style  = { fg = "darkgray" }

[mode]
normal_main = { fg = "white", bg = "blue",    bold = true }
normal_alt  = { fg = "blue",  bg = "darkgray" }

select_main = { fg = "white", bg = "magenta",  bold = true }
select_alt  = { fg = "magenta", bg = "darkgray" }

unset_main = { fg = "white", bg = "red",     bold = true }
unset_alt  = { fg = "red",   bg = "darkgray" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "darkgray", bg = "darkgray" }

progress_label  = { fg = "white", bold = true }
progress_normal = { fg = "blue",  bg = "darkgray" }
progress_error  = { fg = "red",   bg = "darkgray" }

permissions_t = { fg = "blue" }
permissions_r = { fg = "yellow" }
permissions_w = { fg = "red" }
permissions_x = { fg = "green" }
permissions_s = { fg = "darkgray" }

[input]
border   = { fg = "blue" }
title    = {}
value    = {}
selected = { reversed = true }

[confirm]
border       = { fg = "blue" }
title        = { fg = "blue" }
body         = {}
list         = {}
btn_yes      = { reversed = true }
btn_no       = {}
btn_labels   = [ "  [Y]es  ", "  (N)o  " ]

[pick]
border   = { fg = "blue" }
active   = { fg = "magenta", bold = true }
inactive = {}

[cmp]
border         = { fg = "blue" }
active         = { reversed = true }
inactive       = {}
icon_file      = ""
icon_folder    = ""
icon_command   = ""

[tasks]
border  = { fg = "blue" }
title   = {}
hovered = { underline = true }

[which]
mask            = {}
cand            = { fg = "cyan" }
rest            = { fg = "darkgray" }
desc            = { fg = "magenta" }
separator       = "  "
separator_style = { fg = "darkgray" }

[help]
on      = { fg = "magenta" }
run     = { fg = "cyan" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "darkgray", bg = "white" }

[notify]
title_info  = { fg = "cyan" }
title_warn  = { fg = "yellow" }
title_error = { fg = "red" }
