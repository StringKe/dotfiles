# [TEMPLATE] yazi/theme.toml
# 部署目标: ~/.config/yazi/theme.toml
# AI 部署时复制此文件（仅当目标不存在），不修改本文件。
#
# Catppuccin Latte 主题（手写最常用部分，完整版可从 catppuccin/yazi 拉）
# https://github.com/catppuccin/yazi

[mgr]
cwd = { fg = "#1e66f5" }

hovered         = { reversed = true }
preview_hovered = { underline = true }

find_keyword  = { fg = "#df8e1d", bold = true, italic = true, underline = true }
find_position = { fg = "#ea76cb", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#40a02b", bg = "#40a02b" }
marker_cut      = { fg = "#d20f39", bg = "#d20f39" }
marker_marked   = { fg = "#179299", bg = "#179299" }
marker_selected = { fg = "#1e66f5", bg = "#1e66f5" }

tab_active   = { reversed = true }
tab_inactive = {}
tab_width    = 1

count_copied   = { fg = "#eff1f5", bg = "#40a02b" }
count_cut      = { fg = "#eff1f5", bg = "#d20f39" }
count_selected = { fg = "#eff1f5", bg = "#1e66f5" }

border_symbol = "│"
border_style  = { fg = "#9ca0b0" }

[mode]
normal_main = { fg = "#eff1f5", bg = "#1e66f5", bold = true }
normal_alt  = { fg = "#1e66f5", bg = "#bcc0cc" }

select_main = { fg = "#eff1f5", bg = "#40a02b", bold = true }
select_alt  = { fg = "#40a02b", bg = "#bcc0cc" }

unset_main = { fg = "#eff1f5", bg = "#8839ef", bold = true }
unset_alt  = { fg = "#8839ef", bg = "#bcc0cc" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#bcc0cc", bg = "#bcc0cc" }

progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#1e66f5", bg = "#bcc0cc" }
progress_error  = { fg = "#d20f39", bg = "#bcc0cc" }

permissions_t = { fg = "#1e66f5" }
permissions_r = { fg = "#df8e1d" }
permissions_w = { fg = "#d20f39" }
permissions_x = { fg = "#40a02b" }
permissions_s = { fg = "#9ca0b0" }

[input]
border   = { fg = "#1e66f5" }
title    = {}
value    = {}
selected = { reversed = true }

[confirm]
border       = { fg = "#1e66f5" }
title        = { fg = "#1e66f5" }
content      = {}
list         = {}
btn_yes      = { reversed = true }
btn_no       = {}
btn_labels   = [{ fg = "#40a02b" }, { fg = "#d20f39" }]

[pick]
border   = { fg = "#1e66f5" }
active   = { fg = "#ea76cb", bold = true }
inactive = {}

[cmp]
border         = { fg = "#1e66f5" }
active         = { reversed = true }
inactive       = {}
icon_file      = { fg = "#179299" }
icon_folder    = { fg = "#1e66f5" }
icon_command   = { fg = "#df8e1d" }

[tasks]
border  = { fg = "#1e66f5" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#ccd0da" }
cand            = { fg = "#179299" }
rest            = { fg = "#8c8fa1" }
desc            = { fg = "#ea76cb" }
separator       = "  "
separator_style = { fg = "#9ca0b0" }

[help]
on      = { fg = "#ea76cb" }
run     = { fg = "#179299" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "#bcc0cc", bg = "#4c4f69" }

[notify]
title_info = { fg = "#179299" }
title_warn = { fg = "#df8e1d" }
title_error = { fg = "#d20f39" }
