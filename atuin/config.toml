# [TEMPLATE] atuin/config.toml
# 部署目标: ~/.config/atuin/config.toml
# AI 部署时复制此文件（仅当目标不存在），不修改本文件。

enter_accept = true
style = "compact"
inline_height = 12
show_preview = true

[sync]
records = true

# 主题：atuin 18.x 没有 GitHub Light Colorblind 内置主题，
# fallback 到 atuin 默认（会跟随终端 ANSI 配色，即 ghostty 的 GitHub Light Colorblind）
